name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de las pruebas (no necesitan GPU)
        run: pip install pytest genanki opencv-python-headless numpy
      - name: Correr pruebas
        run: PYTHONPATH=src python -m pytest -q
